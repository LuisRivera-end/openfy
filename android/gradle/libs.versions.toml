[versions]
agp = "9.2.0"
kotlin = "2.4.21"
ksp = "2.3.14"
compose = "2026.09.00"
media3 = "1.9.4"
room = "2.8.4"
quickjs = "1.0.18"
coroutines = "1.10.2"
serialization = "1.9.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
activity = { module = "androidx.activity:activity-compose", version = "1.12.1" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.10.0" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.10.0" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.2.0" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.11.0" }
media3-player = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
coil = { module = "io.coil-kt.coil3:coil-compose", version = "3.3.0" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version = "3.3.0" }
palette = { group = "androidx.palette", name = "palette-ktx", version = "1.0.0" }
quickjs = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }
quickjs-jvm = { module = "io.github.dokar3:quickjs-kt-jvm", version.ref = "quickjs" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
documentfile = { module = "androidx.documentfile:documentfile", version = "1.1.0" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-test = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
test-espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
